<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Müzik Arşivi - Sanatçılar, albümler ve müzik keşfi">
    <meta name="theme-color" content="#1a1a2e">

    <title>Müzik Arşivi</title>

    <!-- PWA Ready -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header__brand">
                <span class="header__icon">🎵</span>
                <h1 class="header__title">Müzik Arşivi</h1>
            </div>
            <nav class="header__nav">
                <button class="btn btn--primary" id="addArtistBtn">
                    <span>+</span> Sanatçı Ekle
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Hero Section -->
            <section class="hero">
                <h2 class="hero__title">Müzik Koleksiyonu</h2>
                <p class="hero__subtitle">Favori sanatçılarını keşfet ve arşivle</p>
            </section>

            <!-- Search and Filter -->
            <section class="filters-section">
                <div class="search-container">
                    <input type="text" id="searchArtist" class="search-input" placeholder="Sanatçı ara...">
                </div>
                <div class="filter-container">
                    <select id="genreFilter" class="filter-select">
                        <option value="all">Tüm Türler</option>
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="rap">Rap</option>
                        <option value="halk">Halk Müziği</option>
                        <option value="arabesk">Arabesk</option>
                        <option value="alternatif">Alternatif</option>
                    </select>
                </div>
            </section>

            <!-- Artists Grid -->
            <section class="artists-section">
                <div class="artists-grid" id="artistsGrid">
                    <!-- Artist cards will be injected here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="artistModal">
            <button class="modal__close" id="modalClose">&times;</button>
            <div class="modal__content" id="modalContent">
                <!-- Modal content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Add Artist Modal -->
    <div class="modal-overlay" id="addArtistOverlay">
        <div class="modal modal--form">
            <button class="modal__close" id="addArtistClose">&times;</button>
            <div class="modal__content">
                <h2 class="modal__title">Yeni Sanatçı Ekle</h2>
                <form id="addArtistForm" class="form">
                    <div class="form__group">
                        <label for="artistName" class="form__label">Sanatçı Adı</label>
                        <input type="text" id="artistName" class="form__input" placeholder="Örn: Şebnem Ferah" required>
                    </div>
                    <div class="form__group">
                        <label for="artistBio" class="form__label">Biyografi</label>
                        <textarea id="artistBio" class="form__input form__textarea"
                            placeholder="Sanatçı hakkında kısa bilgi..." rows="3"></textarea>
                    </div>
                    <div class="form__group">
                        <label for="artistImage" class="form__label">Fotoğraf URL</label>
                        <input type="url" id="artistImage" class="form__input" placeholder="https://...">
                    </div>
                    <div class="form__group">
                        <label class="form__label">Bağlantılar</label>
                        <input type="url" id="artistWikipedia" class="form__input" placeholder="Wikipedia URL">
                        <input type="url" id="artistSpotify" class="form__input" placeholder="Spotify URL"
                            style="margin-top: 0.5rem;">
                    </div>
                    <button type="submit" class="btn btn--primary btn--full">
                        Sanatçı Ekle
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Müzik Arşivi. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- App Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
