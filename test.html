<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library - Test Sayfası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .test-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-section h3 {
            color: #1DB954;
            margin-bottom: 15px;
        }

        .test-btn {
            background: linear-gradient(135deg, #1DB954, #1ed760);
            color: black;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            border: none;
            margin: 5px;
        }

        .test-btn:hover {
            transform: scale(1.05);
        }

        .test-btn.secondary {
            background: #333;
            color: white;
        }

        .result-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .status-ok {
            color: #1DB954;
        }

        .status-error {
            color: #ff4444;
        }

        .status-warn {
            color: #ffaa00;
        }

        /* Mini Player Test Styles */
        .mini-player-test {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to right, #282828, #181818);
            border-top: 1px solid #333;
            padding: 12px 20px;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .mini-player-test.active {
            transform: translateY(0);
        }

        .mini-player-progress {
            height: 4px;
            background: #404040;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            cursor: pointer;
        }

        .mini-player-progress-bar {
            height: 100%;
            background: #1DB954;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>

<body class="p-8">
    <div class="max-w-4xl mx-auto pb-32">
        <h1 class="text-4xl font-bold mb-2">🧪 Music Library Test Sayfası</h1>
        <p class="text-gray-400 mb-8">Tüm özellikleri burada test edebilirsin. Her bölüm bağımsız çalışır.</p>

        <!-- API Durumu -->
        <div class="test-section">
            <h3><i class="fa-solid fa-server mr-2"></i>API Durumu</h3>
            <button class="test-btn" onclick="testAPI()">API'yi Test Et</button>
            <button class="test-btn secondary" onclick="testSpotify()">Spotify API Test</button>
            <div id="apiResult" class="result-box"></div>
        </div>

        <!-- Auth Test -->
        <div class="test-section">
            <h3><i class="fa-solid fa-user mr-2"></i>Kullanıcı Auth</h3>
            <div class="flex gap-4 mb-4">
                <input type="text" id="testUsername" placeholder="Kullanıcı adı"
                    class="bg-gray-800 px-4 py-2 rounded text-white flex-1">
                <input type="password" id="testPassword" placeholder="Şifre"
                    class="bg-gray-800 px-4 py-2 rounded text-white flex-1">
            </div>
            <button class="test-btn" onclick="testRegister()">Kayıt Ol</button>
            <button class="test-btn" onclick="testLogin()">Giriş Yap</button>
            <button class="test-btn secondary" onclick="testMe()">Kullanıcı Bilgisi (/me)</button>
            <div id="authResult" class="result-box"></div>
        </div>

        <!-- Mini Player Test -->
        <div class="test-section">
            <h3><i class="fa-solid fa-play mr-2"></i>Mini Player / Şarkı Preview</h3>
            <p class="text-gray-400 text-sm mb-4">Bu test gerçek Spotify preview URL'lerini kullanır.</p>
            <button class="test-btn" onclick="testMiniPlayer()">Mini Player'ı Aç</button>
            <button class="test-btn secondary" onclick="closeMiniPlayer()">Kapat</button>
            <button class="test-btn secondary" onclick="testPreviewSearch()">Şarkı Ara (Preview test)</button>
            <div id="miniPlayerResult" class="result-box"></div>
            <div id="trackList" class="mt-4 space-y-2"></div>
        </div>

        <!-- Arama Test -->
        <div class="test-section">
            <h3><i class="fa-solid fa-search mr-2"></i>Arama Testi</h3>
            <div class="flex gap-4 mb-4">
                <input type="text" id="searchQuery" placeholder="Sanatçı veya şarkı ara..."
                    class="bg-gray-800 px-4 py-2 rounded text-white flex-1" value="Daft Punk">
                <select id="searchType" class="bg-gray-800 px-4 py-2 rounded text-white">
                    <option value="artist">Sanatçı</option>
                    <option value="track">Şarkı</option>
                    <option value="album">Albüm</option>
                </select>
            </div>
            <button class="test-btn" onclick="testSearch()">Ara</button>
            <div id="searchResult" class="result-box"></div>
        </div>

        <!-- Toast Test -->
        <div class="test-section">
            <h3><i class="fa-solid fa-bell mr-2"></i>Toast Bildirimleri</h3>
            <button class="test-btn" onclick="showToast('✅ Başarılı!')">Başarı Toast</button>
            <button class="test-btn secondary" onclick="showToast('❌ Hata oluştu!')">Hata Toast</button>
            <button class="test-btn secondary" onclick="showToast('⚠️ Uyarı!')">Uyarı Toast</button>
        </div>

        <!-- Özet -->
        <div class="test-section">
            <h3><i class="fa-solid fa-clipboard-check mr-2"></i>Hızlı Kontrol</h3>
            <button class="test-btn" onclick="runAllTests()">Tüm Testleri Çalıştır</button>
            <div id="summaryResult" class="result-box"></div>
        </div>
    </div>

    <!-- Mini Player -->
    <div id="miniPlayer" class="mini-player-test">
        <div class="mini-player-progress" onclick="seekTrack(event)">
            <div id="miniPlayerProgress" class="mini-player-progress-bar"></div>
        </div>
        <div class="flex items-center gap-4 max-w-4xl mx-auto">
            <img id="miniPlayerImage" src="" class="w-14 h-14 rounded object-cover shadow-lg">
            <div class="flex-1 min-w-0">
                <p id="miniPlayerTitle" class="font-bold truncate"></p>
                <p id="miniPlayerArtist" class="text-sm text-gray-400 truncate"></p>
            </div>
            <div class="flex items-center gap-4">
                <span id="miniPlayerTime" class="text-xs text-gray-400 w-24 text-center">0:00 / 0:30</span>
                <button onclick="toggleMiniPlayer()"
                    class="w-12 h-12 bg-white rounded-full flex items-center justify-center hover:scale-105 transition">
                    <i id="miniPlayerIcon" class="fa-solid fa-play text-black text-xl"></i>
                </button>
                <button onclick="closeMiniPlayer()" class="text-gray-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('userToken');
        let currentAudio = null;
        let playingTrackId = null;

        // Utility
        function log(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            const time = new Date().toLocaleTimeString();
            const colorClass = type === 'ok' ? 'status-ok' : type === 'error' ? 'status-error' : type === 'warn' ? 'status-warn' : '';
            el.innerHTML += `<div class="${colorClass}">[${time}] ${message}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-800 border border-gray-700 px-4 py-3 rounded-lg shadow-lg animate-pulse';
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // API Tests
        async function testAPI() {
            log('apiResult', 'API bağlantısı test ediliyor...');
            try {
                const start = Date.now();
                const res = await fetch(API_URL + '/search?artist=test&type=artist');
                const time = Date.now() - start;

                if (res.ok) {
                    log('apiResult', `✅ API çalışıyor (${time}ms)`, 'ok');
                } else {
                    log('apiResult', `⚠️ API yanıt verdi ama hata: ${res.status}`, 'warn');
                }
            } catch (e) {
                log('apiResult', `❌ API bağlantı hatası: ${e.message}`, 'error');
            }
        }

        async function testSpotify() {
            log('apiResult', 'Spotify API test ediliyor...');
            try {
                const res = await fetch(API_URL + '/search?artist=Daft Punk&type=track');
                const data = await res.json();

                if (data.length > 0) {
                    log('apiResult', `✅ Spotify API çalışıyor. ${data.length} sonuç bulundu.`, 'ok');
                    const withPreview = data.filter(t => t.preview_url);
                    log('apiResult', `   └─ Preview URL'li şarkılar: ${withPreview.length}/${data.length}`, withPreview.length > 0 ? 'ok' : 'warn');
                } else {
                    log('apiResult', '⚠️ Spotify sonuç döndürmedi', 'warn');
                }
            } catch (e) {
                log('apiResult', `❌ Spotify API hatası: ${e.message}`, 'error');
            }
        }

        // Auth Tests
        async function testRegister() {
            const username = document.getElementById('testUsername').value || 'testuser' + Date.now();
            const password = document.getElementById('testPassword').value || 'test123';

            log('authResult', `Kayıt deneniyor: ${username}`);
            try {
                const res = await fetch(API_URL + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.token) {
                    token = data.token;
                    localStorage.setItem('userToken', token);
                    log('authResult', `✅ Kayıt başarılı! Token alındı.`, 'ok');
                } else {
                    log('authResult', `⚠️ Kayıt başarısız: ${data.error}`, 'warn');
                }
            } catch (e) {
                log('authResult', `❌ Kayıt hatası: ${e.message}`, 'error');
            }
        }

        async function testLogin() {
            const username = document.getElementById('testUsername').value;
            const password = document.getElementById('testPassword').value;

            if (!username || !password) {
                log('authResult', '⚠️ Kullanıcı adı ve şifre girin', 'warn');
                return;
            }

            log('authResult', `Giriş deneniyor: ${username}`);
            try {
                const res = await fetch(API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.token) {
                    token = data.token;
                    localStorage.setItem('userToken', token);
                    log('authResult', `✅ Giriş başarılı!`, 'ok');
                } else {
                    log('authResult', `⚠️ Giriş başarısız: ${data.error}`, 'warn');
                }
            } catch (e) {
                log('authResult', `❌ Giriş hatası: ${e.message}`, 'error');
            }
        }

        async function testMe() {
            if (!token) {
                log('authResult', '⚠️ Önce giriş yapın', 'warn');
                return;
            }

            try {
                const res = await fetch(API_URL + '/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();

                log('authResult', `✅ Kullanıcı verisi alındı:`, 'ok');
                log('authResult', `   └─ Beğeniler: ${data.likes?.length || 0}`);
                log('authResult', `   └─ Takip: ${data.follows?.length || 0}`);
            } catch (e) {
                log('authResult', `❌ /me hatası: ${e.message}`, 'error');
            }
        }

        // Search Tests
        async function testSearch() {
            const query = document.getElementById('searchQuery').value;
            const type = document.getElementById('searchType').value;

            log('searchResult', `Aranıyor: "${query}" (${type})`);
            try {
                const res = await fetch(`${API_URL}/search?artist=${encodeURIComponent(query)}&type=${type}`);
                const data = await res.json();

                if (Array.isArray(data)) {
                    log('searchResult', `✅ ${data.length} sonuç bulundu`, 'ok');
                    data.slice(0, 3).forEach(item => {
                        log('searchResult', `   └─ ${item.name || item.trackName}`);
                    });
                } else if (data.name) {
                    log('searchResult', `✅ Sanatçı bulundu: ${data.name}`, 'ok');
                    log('searchResult', `   └─ Albüm sayısı: ${data.albums?.length || 0}`);
                }
            } catch (e) {
                log('searchResult', `❌ Arama hatası: ${e.message}`, 'error');
            }
        }

        // Mini Player Tests
        async function testPreviewSearch() {
            log('miniPlayerResult', 'Preview URL\'li şarkılar aranıyor...');
            try {
                const res = await fetch(`${API_URL}/search?artist=Daft Punk&type=track`);
                const data = await res.json();

                const tracksWithPreview = data.filter(t => t.preview_url);
                log('miniPlayerResult', `Bulunan: ${data.length} şarkı, ${tracksWithPreview.length} preview var`, tracksWithPreview.length > 0 ? 'ok' : 'warn');

                // Render track list
                const trackList = document.getElementById('trackList');
                trackList.innerHTML = '';

                tracksWithPreview.slice(0, 5).forEach(track => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-4 p-3 bg-gray-800 rounded hover:bg-gray-700 cursor-pointer';
                    div.onclick = () => playTrack(track.id, track.preview_url, track.name, track.image, track.artist);
                    div.innerHTML = `
                        <img src="${track.image}" class="w-12 h-12 rounded">
                        <div class="flex-1">
                            <p class="font-bold">${track.name}</p>
                            <p class="text-sm text-gray-400">${track.artist}</p>
                        </div>
                        <i class="fa-solid fa-play text-green-500"></i>
                    `;
                    trackList.appendChild(div);
                });

                if (tracksWithPreview.length > 0) {
                    log('miniPlayerResult', '👆 Yukarıdaki şarkılara tıklayarak test edebilirsin', 'ok');
                }
            } catch (e) {
                log('miniPlayerResult', `❌ Hata: ${e.message}`, 'error');
            }
        }

        function testMiniPlayer() {
            // Test with a known working preview URL
            const testTrack = {
                id: 'test123',
                url: 'https://p.scdn.co/mp3-preview/6354e7e1f5ddf2c47a58d35f58698a0d3d9c8f63',
                name: 'Test Track - Daft Punk',
                image: 'https://i.scdn.co/image/ab67616d0000b273b33d46dfa2f8e36a2e5b55e3',
                artist: 'Test Artist'
            };

            log('miniPlayerResult', 'Mini Player test ediliyor...', 'ok');
            playTrack(testTrack.id, testTrack.url, testTrack.name, testTrack.image, testTrack.artist);
        }

        function playTrack(id, url, name, image, artist) {
            if (!url || url === 'null' || url === 'undefined') {
                showToast('⚠️ Bu şarkı için önizleme mevcut değil');
                log('miniPlayerResult', '⚠️ Preview URL yok', 'warn');
                return;
            }

            log('miniPlayerResult', `▶️ Çalınıyor: ${name}`, 'ok');

            const miniPlayer = document.getElementById('miniPlayer');
            const isCurrentTrack = currentAudio && playingTrackId === id;

            if (isCurrentTrack) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    updateMiniPlayerIcon(true);
                } else {
                    currentAudio.pause();
                    updateMiniPlayerIcon(false);
                }
            } else {
                if (currentAudio) {
                    currentAudio.pause();
                }

                currentAudio = new Audio(url);
                currentAudio.volume = 0.5;
                playingTrackId = id;

                document.getElementById('miniPlayerImage').src = image || 'https://via.placeholder.com/56';
                document.getElementById('miniPlayerTitle').innerText = name || 'Unknown Track';
                document.getElementById('miniPlayerArtist').innerText = artist || '';
                miniPlayer.classList.add('active');

                currentAudio.play().then(() => {
                    log('miniPlayerResult', '✅ Audio çalıyor!', 'ok');
                }).catch(e => {
                    log('miniPlayerResult', `❌ Audio hatası: ${e.message}`, 'error');
                });

                updateMiniPlayerIcon(true);

                currentAudio.ontimeupdate = () => {
                    const progress = (currentAudio.currentTime / currentAudio.duration) * 100;
                    document.getElementById('miniPlayerProgress').style.width = progress + '%';
                    const current = formatTime(currentAudio.currentTime);
                    const total = formatTime(currentAudio.duration || 30);
                    document.getElementById('miniPlayerTime').innerText = `${current} / ${total}`;
                };

                currentAudio.onended = () => {
                    playingTrackId = null;
                    updateMiniPlayerIcon(false);
                    document.getElementById('miniPlayerProgress').style.width = '0%';
                    log('miniPlayerResult', '⏹️ Şarkı bitti', 'ok');
                };

                currentAudio.onerror = (e) => {
                    log('miniPlayerResult', `❌ Audio yükleme hatası`, 'error');
                    closeMiniPlayer();
                };
            }
        }

        function toggleMiniPlayer() {
            if (!currentAudio) return;
            if (currentAudio.paused) {
                currentAudio.play();
                updateMiniPlayerIcon(true);
            } else {
                currentAudio.pause();
                updateMiniPlayerIcon(false);
            }
        }

        function closeMiniPlayer() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            playingTrackId = null;
            document.getElementById('miniPlayer').classList.remove('active');
            log('miniPlayerResult', 'Mini Player kapatıldı');
        }

        function seekTrack(event) {
            if (!currentAudio) return;
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            currentAudio.currentTime = percent * currentAudio.duration;
        }

        function updateMiniPlayerIcon(playing) {
            const icon = document.getElementById('miniPlayerIcon');
            icon.className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'} text-black text-xl`;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Run All Tests
        async function runAllTests() {
            document.getElementById('summaryResult').innerHTML = '';
            const results = [];

            log('summaryResult', '🧪 Tüm testler başlıyor...');

            // Test 1: API
            try {
                const res = await fetch(API_URL + '/search?artist=test&type=artist');
                results.push({ name: 'API Bağlantısı', ok: res.ok });
            } catch (e) {
                results.push({ name: 'API Bağlantısı', ok: false });
            }

            // Test 2: Spotify
            try {
                const res = await fetch(API_URL + '/search?artist=test&type=track');
                const data = await res.json();
                results.push({ name: 'Spotify API', ok: Array.isArray(data) });
            } catch (e) {
                results.push({ name: 'Spotify API', ok: false });
            }

            // Test 3: Preview URL
            try {
                const res = await fetch(API_URL + '/search?artist=Daft Punk&type=track');
                const data = await res.json();
                const hasPreview = data.some(t => t.preview_url);
                results.push({ name: 'Preview URLs', ok: hasPreview });
            } catch (e) {
                results.push({ name: 'Preview URLs', ok: false });
            }

            // Summary
            log('summaryResult', '─────────────────────');
            results.forEach(r => {
                log('summaryResult', `${r.ok ? '✅' : '❌'} ${r.name}`, r.ok ? 'ok' : 'error');
            });

            const passCount = results.filter(r => r.ok).length;
            log('summaryResult', '─────────────────────');
            log('summaryResult', `Sonuç: ${passCount}/${results.length} test geçti`, passCount === results.length ? 'ok' : 'warn');
        }

        // Auto-run basic check on load
        window.onload = () => {
            log('apiResult', 'Sayfa yüklendi. Test etmeye başlayabilirsin!');
        };
    </script>
</body>

</html>
