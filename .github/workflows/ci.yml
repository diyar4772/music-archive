name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Existing tests use in-memory storage; the studio integration suite
      # uses this job's local MongoDB and randomly named test database.
      # No repository secrets or external accounts are used.
      - run: npm test
        env:
          STUDIO_TEST_MONGO: mongodb://127.0.0.1:27017

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .gitattributes normalises text files to LF; this fails if a CRLF file
      # is committed anyway. mobile/ is excluded because it was deliberately
      # left out of the normalisation pass and still ships CRLF throughout.
      - name: Reject CRLF in tracked text files
        run: |
          if git grep -Il $'\r' -- . ':!mobile' ':!*.png' ':!*.jpg' ':!*.svg'; then
            echo "::error::CRLF line endings found in the files listed above"
            exit 1
          fi
