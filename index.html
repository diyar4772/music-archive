<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Archive — Kişisel müzik arşivin</title>
    <meta name="description"
        content="Sevdiğin şarkıları, sanatçıları, puanlarını ve kişisel notlarını düzenli bir koleksiyonda tutan kişisel müzik arşivi.">
    <meta name="theme-color" content="#0A0A0B">
    <!-- Inline so the app ships its own icon instead of 404ing on /favicon.ico -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23F472B6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='white'/%3E%3C/svg%3E">
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme-config.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/js/styles.css">
</head>
<body
    class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark min-h-screen flex flex-col items-center py-6 px-4 transition-colors duration-200 font-display">
    <!-- Toast target for utils.js showToast(). Without this element every success
         and error notification was written into a no-op. -->
    <div id="toast" role="status" aria-live="polite" class="opacity-0 translate-y-20"></div>
    <!-- Navbar Container (will be rendered by Navbar component).
         w-full so the bar spans the page instead of shrinking to its content. -->
    <div id="navbar" class="w-full flex justify-center"></div>
    <!-- Search Bar Container (will be rendered by SearchBar component) -->
    <div id="searchBar"></div>
    <!-- App Container (Router will render views here) -->
    <div id="app" class="w-full"></div>
    <!-- Modals -->
    <!-- Auth Modal -->
    <div id="authModal"
        class="modal hidden fixed inset-0 bg-black/50 dark:bg-black/80 flex justify-center items-center z-[70]">
        <div
            class="bg-white dark:bg-card-dark p-8 rounded-xl w-full max-w-sm border border-gray-200 dark:border-white/5 shadow-xl">
            <h2 class="text-2xl font-bold mb-6" id="authTitle">Giriş Yap</h2>
            <!-- Owned entirely by js/app.js: a real form so Enter submits, no inline
                 onclick, and no mode detection from the heading text. -->
            <form id="authForm" novalidate>
                <input type="text" id="authUsername" name="username" autocomplete="username"
                    placeholder="Kullanıcı adı"
                    class="w-full bg-gray-100 dark:bg-[#1a1a24] border border-gray-200 dark:border-white/10 p-3 rounded-lg mb-4 text-text-light dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors">
                <input type="password" id="authPassword" name="password" autocomplete="current-password"
                    placeholder="Parola"
                    class="w-full bg-gray-100 dark:bg-[#1a1a24] border border-gray-200 dark:border-white/10 p-3 rounded-lg mb-4 text-text-light dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors">
                <p id="authError" role="alert" aria-live="polite"
                    class="hidden mb-4 text-sm text-red-500 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2">
                </p>
                <button type="submit" id="authSubmit"
                    class="w-full btn-spotify text-white font-bold py-3 rounded-full disabled:opacity-60 disabled:cursor-not-allowed">Gönder</button>
            </form>
            <button type="button" id="authSwitch"
                class="w-full mt-4 text-center text-sm text-text-secondary-light dark:text-gray-400 hover:underline">Hesabın
                yok mu? Kayıt ol</button>
            <button type="button" id="authClose"
                class="w-full mt-4 text-gray-500 hover:text-text-light dark:hover:text-white transition-colors">Kapat</button>
        </div>
    </div>
    <!-- Main Application Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
