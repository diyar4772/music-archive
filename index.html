<!DOCTYPE html>
<html lang="tr" class="dark" data-ma-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Archive — Kişisel müzik arşivin</title>
    <meta name="description"
        content="Sevdiğin şarkıları, sanatçıları, puanlarını ve kişisel notlarını düzenli bir koleksiyonda tutan kişisel müzik arşivi.">
    <meta name="theme-color" content="#0A0A0B">
    <!-- Inline so the app ships its own icon instead of 404ing on /favicon.ico -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23F472B6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='white'/%3E%3C/svg%3E">
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Tailwind CSS — still carries the older modal markup in Shell.js. Every
         redesigned surface uses the `ma-*` classes from styles.css instead. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme-config.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/js/styles.css">
    <link rel="stylesheet" href="/js/studio.css">
    <!-- Paint the saved theme before first paint so a light-mode reload does not
         flash the dark page. Mirrors applyTheme() in js/app.js. -->
    <script src="/js/theme-boot.js"></script>
</head>

<body>
    <div class="ma-app">
        <!-- Sticky header (rendered by the Navbar component) -->
        <div id="navbar"></div>

        <!-- Router renders the active view here -->
        <div id="app"></div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal hidden" style="position:fixed;inset:0;z-index:70;display:flex;align-items:center;
         justify-content:center;padding:16px;background:rgba(10,10,11,.72)">
        <div class="ma-card" style="width:100%;max-width:400px;padding:28px">
            <div class="ma-kicker" data-lang="landing.badge"></div>
            <h2 style="margin:10px 0 22px;font-size:24px;font-weight:700;letter-spacing:-0.02em" id="authTitle"></h2>
            <!-- Owned entirely by js/app.js: a real form so Enter submits, no inline
                 onclick, and no mode detection from the heading text. -->
            <form id="authForm" novalidate data-testid="auth-form">
                <input type="text" id="authUsername" name="username" autocomplete="username" class="ma-input" data-testid="auth-username"
                    data-lang-placeholder="auth.username" style="margin-bottom:12px">
                <input type="password" id="authPassword" name="password" autocomplete="current-password"
                    class="ma-input" data-testid="auth-password" data-lang-placeholder="auth.password" style="margin-bottom:12px">
                <p id="authError" role="alert" aria-live="polite" class="hidden"
                    style="margin:0 0 14px;font-size:13px;color:var(--err-ink);background:rgba(239,68,68,.12);
                           border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 12px"></p>
                <button type="submit" id="authSubmit" class="ma-btn ma-btn-primary ma-btn-lg" data-testid="auth-submit"
                    style="width:100%"></button>
            </form>
            <button type="button" id="authSwitch" class="ma-btn ma-btn-ghost" data-testid="auth-switch"
                style="width:100%;margin-top:12px;font-size:13px"></button>
            <button type="button" id="authClose" class="ma-btn ma-btn-sm" data-testid="auth-close"
                style="width:100%;margin-top:4px;color:var(--ink3)" data-lang="common.close"></button>
        </div>
    </div>

    <!-- Main Application Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
