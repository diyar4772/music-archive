<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library V3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .spotify-green {
            color: #1DB954;
        }

        .bg-spotify {
            background-color: #1DB954;
        }

        .btn-spotify {
            background-color: #1DB954;
            transition: 0.3s;
        }

        .btn-spotify:hover {
            background-color: #1ed760;
        }

        .modal {
            transition: opacity 0.3s ease-in-out;
        }

        .modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #282828;
            border-radius: 0 0 8px 8px;
            z-index: 50;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .autocomplete-item:hover {
            background: #333;
        }

        .playing-row {
            background-color: rgba(29, 185, 84, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Top Bar -->
    <div class="w-full max-w-6xl flex justify-between items-center mb-6 relative z-50">
        <h1 class="text-3xl font-bold cursor-pointer" onclick="showDashboard()">Music <span
                class="spotify-green">Library</span></h1>

        <div id="authSection" class="relative"></div>

        <div id="profileDropdown"
            class="hidden absolute right-0 top-12 bg-[#282828] w-56 rounded shadow-xl z-50 border border-gray-700">
            <button onclick="openProfileModal('likes')"
                class="w-full text-left px-4 py-3 hover:bg-[#333] border-b border-gray-700 flex justify-between items-center">
                <span data-lang="liked_songs">Beğenilen Şarkılar</span> <i class="fa-solid fa-heart text-green-500"></i>
            </button>
            <button onclick="openProfileModal('follows')"
                class="w-full text-left px-4 py-3 hover:bg-[#333] border-b border-gray-700 flex justify-between items-center">
                <span data-lang="following">Takip Edilenler</span> <i class="fa-solid fa-user text-blue-400"></i>
            </button>
            <button onclick="openProfileModal('playlists')"
                class="w-full text-left px-4 py-3 hover:bg-[#333] border-b border-gray-700 flex justify-between items-center">
                <span data-lang="playlists">Listelerim</span> <i class="fa-solid fa-music text-green-500"></i>
            </button>
            <button onclick="createPlaylist()"
                class="w-full text-left px-4 py-3 hover:bg-[#333] border-b border-gray-700 flex justify-between items-center">
                <span data-lang="create_playlist">Liste Oluştur</span> <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="openSettingsModal()"
                class="w-full text-left px-4 py-3 hover:bg-[#333] border-b border-gray-700 flex justify-between items-center">
                <span data-lang="settings">Ayarlar</span> <i class="fa-solid fa-gear text-gray-400"></i>
            </button>
            <button onclick="logout()" class="w-full text-left px-4 py-3 hover:bg-[#333] text-red-400">
                <span data-lang="logout">Çıkış Yap</span>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden fixed inset-0 bg-black/80 z-[70] flex items-center justify-center p-4">
        <div class="bg-[#282828] w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="closeSettingsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-6" data-lang="settings">Ayarlar</h2>

            <div class="space-y-6">
                <!-- Theme -->
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold" data-lang="theme">Tema</h3>
                        <p class="text-xs text-gray-400" data-lang="theme_desc">Koyu/Açık mod değiştir</p>
                    </div>
                    <button onclick="toggleTheme()" class="bg-[#333] p-3 rounded-lg hover:bg-[#444] transition">
                        <i id="themeIcon" class="fa-solid fa-moon text-yellow-400 text-xl"></i>
                    </button>
                </div>

                <!-- Language -->
                <div>
                    <h3 class="font-bold mb-2" data-lang="language">Dil</h3>
                    <select id="languageSelect" onchange="changeLanguage(this.value)"
                        class="w-full bg-[#333] border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-green-500">
                        <option value="tr">🇹🇷 Türkçe</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="ku">🟢 Kurdî (Kurmancî)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Section -->
    <div class="w-full max-w-xl mb-8 relative z-40">
        <div class="flex gap-3 relative">
            <input type="text" id="searchInput" placeholder="Search for artists or tracks..."
                class="flex-1 px-5 py-3 rounded-full bg-gray-800 border-none focus:ring-2 focus:ring-[#1DB954] text-white outline-none"
                autocomplete="off">
            <button onclick="performSearch()" class="btn-spotify text-black font-bold px-6 py-3 rounded-full">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div id="autocompleteList" class="autocomplete-list hidden"></div>

        <!-- Filter Chips -->
        <div class="flex gap-2 mt-4 justify-center">
            <button onclick="setSearchType('artist')" id="type-artist"
                class="px-3 py-1 bg-[#282828] rounded-full text-sm font-medium hover:bg-[#333] ring-1 ring-transparent focus:ring-green-500 transition text-green-500">Artists</button>
            <button onclick="setSearchType('track')" id="type-track"
                class="px-3 py-1 bg-[#282828] rounded-full text-sm font-medium hover:bg-[#333] ring-1 ring-transparent focus:ring-green-500 transition">Tracks</button>
        </div>
    </div>

    <!-- Dashboard (Quick Access) -->
    <div id="dashboard" class="w-full max-w-6xl animate-fade-in">
        <h2 class="text-2xl font-bold mb-6">Kütüphanem</h2>

        <!-- Top Row: Special Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <!-- Liked Songs Card -->
            <div onclick="openProfileModal('likes')"
                class="bg-gradient-to-br from-indigo-600 to-purple-700 p-5 rounded-xl cursor-pointer hover:scale-[1.02] transition shadow-lg flex items-center gap-4 group">
                <i class="fa-solid fa-heart text-3xl text-white/80 group-hover:scale-110 transition"></i>
                <div>
                    <h3 class="text-lg font-bold">Beğenilenler</h3>
                    <p class="text-sm text-gray-200" id="likedCount">0 şarkı</p>
                </div>
            </div>

            <!-- Following Card -->
            <div onclick="openProfileModal('follows')"
                class="bg-gradient-to-br from-blue-600 to-cyan-600 p-5 rounded-xl cursor-pointer hover:scale-[1.02] transition shadow-lg flex items-center gap-4 group">
                <i class="fa-solid fa-user-group text-3xl text-white/80 group-hover:scale-110 transition"></i>
                <div>
                    <h3 class="text-lg font-bold">Takip Edilenler</h3>
                    <p class="text-sm text-gray-200" id="followingCount">0 sanatçı</p>
                </div>
            </div>

            <!-- My Playlists Card -->
            <div onclick="openProfileModal('playlists')"
                class="bg-gradient-to-br from-green-600 to-emerald-700 p-5 rounded-xl cursor-pointer hover:scale-[1.02] transition shadow-lg flex items-center gap-4 group">
                <i class="fa-solid fa-list text-3xl text-white/80 group-hover:scale-110 transition"></i>
                <div>
                    <h3 class="text-lg font-bold">Listelerim</h3>
                    <p class="text-sm text-gray-200" id="playlistCount">0 liste</p>
                </div>
            </div>

            <!-- Create Playlist Button -->
            <div onclick="createPlaylist()"
                class="bg-[#282828] hover:bg-[#333] p-5 rounded-xl cursor-pointer transition shadow-lg flex items-center gap-4 border border-dashed border-gray-600 group">
                <i class="fa-solid fa-plus text-3xl text-gray-400 group-hover:text-green-500 transition"></i>
                <div>
                    <h3 class="text-lg font-bold text-gray-300 group-hover:text-white">Yeni Liste</h3>
                    <p class="text-sm text-gray-500">Oluştur</p>
                </div>
            </div>
        </div>

        <!-- Playlists Grid -->
        <div id="playlistsSection" class="hidden">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-music text-green-500"></i>
                Listelerim</h3>
            <div id="playlistsContainer" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8"></div>
        </div>

        <!-- Following Artists Preview -->
        <div id="followingSection" class="hidden">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-user text-blue-400"></i>
                Takip Ettiklerim</h3>
            <div id="followingPreview" class="flex gap-4 overflow-x-auto pb-4"></div>
        </div>
    </div>

    <!-- Results Section -->
    <div id="results" class="w-full max-w-6xl hidden animate-fade-in">
        <button onclick="showDashboard()" class="mb-6 text-gray-400 hover:text-white flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </button>

        <!-- Artist Content -->
        <div id="artistContent" class="hidden">
            <div
                class="flex flex-col md:flex-row items-center gap-8 mb-12 bg-gradient-to-r from-gray-900 to-gray-800 p-8 rounded-2xl shadow-xl">
                <img id="artistImage" src="" class="w-56 h-56 rounded-full object-cover shadow-2xl">
                <div class="text-center md:text-left flex-1">
                    <h2 id="artistName" class="text-5xl font-extrabold mb-4"></h2>
                    <button id="followBtn" onclick="toggleFollow()"
                        class="border border-gray-500 hover:border-white px-6 py-2 rounded-full font-bold uppercase text-xs tracking-widest transition">Follow</button>
                </div>
            </div>
            <h3 class="text-2xl font-bold mb-6">Albums</h3>
            <div id="albumsGrid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div>
        </div>

        <!-- Track Results Content -->
        <div id="trackResults" class="hidden space-y-2"></div>
    </div>

    <!-- Modals -->
    <!-- Auth Modal -->
    <div id="authModal" class="modal hidden fixed inset-0 bg-black/80 flex justify-center items-center z-[70]">
        <div class="bg-gray-900 p-8 rounded-xl w-full max-w-sm border border-gray-800">
            <h2 class="text-2xl font-bold mb-6" id="authTitle">Log In</h2>
            <input type="text" id="authUsername" placeholder="Username"
                class="w-full bg-gray-800 p-3 rounded mb-4 text-white">
            <input type="password" id="authPassword" placeholder="Password"
                class="w-full bg-gray-800 p-3 rounded mb-6 text-white">
            <button onclick="handleAuth()"
                class="w-full btn-spotify text-black font-bold py-3 rounded-full mb-4">Submit</button>
            <p class="text-center text-sm text-gray-400 cursor-pointer hover:underline" onclick="toggleAuthMode()"
                id="authSwitch">Register</p>
            <button onclick="closeAuthModal()" class="w-full mt-4 text-gray-500 hover:text-white">Close</button>
        </div>
    </div>

    <!-- Album/Playlist Details Modal -->
    <div id="detailsModal" class="modal hidden fixed inset-0 bg-black/80 flex justify-center items-center z-[60] p-4">
        <div class="bg-gray-900 rounded-xl w-full max-w-3xl max-h-[85vh] flex flex-col border border-gray-800">
            <div class="p-6 bg-gradient-to-b from-gray-800 to-gray-900 flex gap-6 items-end relative">
                <img id="modalCover" src="" class="w-32 h-32 shadow-lg rounded object-cover">
                <div class="flex-1">
                    <p class="text-sm uppercase tracking-wider text-gray-400" id="modalType">Album</p>
                    <h2 id="modalTitle" class="text-3xl font-bold truncate"></h2>
                </div>
                <button onclick="closeDetailsModal()" class="text-gray-400 hover:text-white"><i
                        class="fa-solid fa-xmark fa-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4" id="modalTracks"></div>
        </div>
    </div>

    <!-- Add to Playlist Modal -->
    <div id="addToPlaylistModal" class="modal hidden fixed inset-0 bg-black/90 flex justify-center items-center z-[80]">
        <div class="bg-gray-800 p-6 rounded-lg w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4">Add to Playlist</h3>
            <div id="playlistOptions" class="space-y-2 max-h-60 overflow-y-auto mb-4"></div>
            <button onclick="document.getElementById('addToPlaylistModal').classList.remove('visible')"
                class="w-full py-2 bg-gray-700 rounded text-gray-300">Cancel</button>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = localStorage.getItem('userUsername');
        let token = localStorage.getItem('userToken');

        // Data
        let followedArtists = [];
        let likedTracks = [];
        let albumFollows = [];
        let playlists = [];
        let searchType = 'artist'; // 'artist' or 'track'
        let currentAudio = null;
        let playingTrackId = null;
        let tempTrackToAdd = null;

        // Settings Data
        const translations = {
            en: {
                liked_songs: "Liked Songs",
                following: "Following",
                playlists: "Playlists",
                create_playlist: "Create Playlist",
                settings: "Settings",
                logout: "Log Out",
                theme: "Theme",
                theme_desc: "Toggle dark/light mode",
                language: "Language",
                search_placeholder: "Search for artists or tracks...",
                library_title: "My Library",
                liked_title: "Liked Songs",
                following_title: "Following",
                playlists_title: "My Playlists",
                create_title: "New Playlist",
                create_desc: "Create",
                followed_albums: "Followed Albums",
                save: "Save",
                saved: "Saved",
                follow: "Follow",
                following_btn: "Following"
            },
            tr: {
                liked_songs: "Beğenilen Şarkılar",
                following: "Takip Edilenler",
                playlists: "Listelerim",
                create_playlist: "Liste Oluştur",
                settings: "Ayarlar",
                logout: "Çıkış Yap",
                theme: "Tema",
                theme_desc: "Koyu/Açık mod değiştir",
                language: "Dil",
                search_placeholder: "Sanatçı veya şarkı ara...",
                library_title: "Kütüphanem",
                liked_title: "Beğenilenler",
                following_title: "Takip Edilenler",
                playlists_title: "Listelerim",
                create_title: "Yeni Liste",
                create_desc: "Oluştur",
                followed_albums: "Takip Edilen Albümler",
                save: "Kaydet",
                saved: "Kütüphanede",
                follow: "Takip Et",
                following_btn: "Takip Ediliyor"
            },
            ku: {
                liked_songs: "Stranên Ecibandî",
                following: "Şopandin",
                playlists: "Lîsteyên Min",
                create_playlist: "Lîste Çêke",
                settings: "Mîheng",
                logout: "Derkeve",
                theme: "Rûxsar",
                theme_desc: "Moda tarî/ronî biguherîne",
                language: "Ziman",
                search_placeholder: "Hunermend an stranan bigere...",
                library_title: "Pirtûkxaneya Min",
                liked_title: "Ecibandî",
                following_title: "Şopandin",
                playlists_title: "Lîsteyên Min",
                create_title: "Lîsteya Nû",
                create_desc: "Çêke",
                followed_albums: "Albumên Şopandî",
                save: "Tomar Bike",
                saved: "Di Pirtûkxaneyê De",
                follow: "Bişopîne",
                following_btn: "Tê Şopandin"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'tr';
        let currentTheme = localStorage.getItem('theme') || 'dark';

        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            if (token) fetchUserData();

            // Load Settings
            applyTheme(currentTheme);
            applyLanguage(currentLang);
            document.getElementById('languageSelect').value = currentLang;

            document.getElementById('searchInput').addEventListener('input', debounce((e) => handleAutocomplete(e.target.value), 400));
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#authSection')) document.getElementById('profileDropdown')?.classList.add('hidden');
                if (!e.target.closest('.w-full.max-w-xl')) document.getElementById('autocompleteList').classList.add('hidden');
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('visible');
                    setTimeout(() => e.target.classList.add('hidden'), 300);
                }
            });
        });

        // --- Settings Functions ---
        function openSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('visible'), 10);
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('visible');
            setTimeout(() => document.getElementById('settingsModal').classList.add('hidden'), 300);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', currentTheme);
            applyTheme(currentTheme);
        }

        function applyTheme(theme) {
            const body = document.body;
            const icon = document.getElementById('themeIcon');

            if (theme === 'light') {
                body.style.backgroundColor = '#f3f4f6';
                body.style.color = '#1f2937';
                icon.className = 'fa-solid fa-sun text-orange-500';
                // Add light mode specific overrides if needed via class
                document.body.classList.add('light-mode');
            } else {
                body.style.backgroundColor = '#121212';
                body.style.color = 'white';
                icon.className = 'fa-solid fa-moon text-yellow-400';
                document.body.classList.remove('light-mode');
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            applyLanguage(lang);
            // Re-render dynamic content to apply translations
            renderPlaylists();
            renderFollowedAlbums();
            renderFollowingPreview();
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (t[key]) {
                    if (el.tagName === 'INPUT') el.placeholder = t[key];
                    else el.innerText = t[key];
                }
            });
            // Manual overrides for complex updates if any
        }


        // --- Core Functions ---
        async function fetchUserData() {
            if (!token) return;
            try {
                // Fetch User Data (Likes/Follows)
                const res = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                followedArtists = data.follows || [];
                likedTracks = data.likes || [];
                albumFollows = data.albumFollows || []; // New

                // Update all counters
                document.getElementById('likedCount').innerText = `${likedTracks.length} şarkı`;
                document.getElementById('followingCount').innerText = `${followedArtists.length} sanatçı`;

                // Fetch Playlists
                const pRes = await fetch(`${API_URL}/playlists`, { headers: { 'Authorization': `Bearer ${token}` } });
                playlists = await pRes.json();
                document.getElementById('playlistCount').innerText = `${playlists.length} liste`;

                renderPlaylists();
                renderFollowingPreview();
                renderFollowedAlbums(); // New

            } catch (e) { console.error('Data sync failed'); }
        }

        function renderPlaylists() {
            const container = document.getElementById('playlistsContainer');
            const section = document.getElementById('playlistsSection');
            container.innerHTML = '';

            if (playlists.length > 0) {
                section.classList.remove('hidden');
                playlists.forEach(pl => {
                    const div = document.createElement('div');
                    div.className = 'bg-[#181818] p-4 rounded-lg hover:bg-[#282828] cursor-pointer transition group';
                    div.onclick = () => openPlaylistDetails(pl);
                    div.innerHTML = `
                        <div class="w-full aspect-square bg-gradient-to-br from-gray-700 to-gray-800 rounded-lg mb-3 flex items-center justify-center">
                            <i class="fa-solid fa-music text-4xl text-gray-500"></i>
                        </div>
                        <p class="font-bold truncate">${pl.name}</p>
                        <p class="text-xs text-gray-400">${pl.PlaylistTracks?.length || 0} şarkı</p>
                    `;
                    container.appendChild(div);
                });
            } else {
                section.classList.add('hidden');
            }
        }

        function renderFollowingPreview() {
            const container = document.getElementById('followingPreview');
            const section = document.getElementById('followingSection');
            container.innerHTML = '';

            if (followedArtists.length > 0) {
                section.classList.remove('hidden');
                followedArtists.forEach(artist => {
                    const div = document.createElement('div');
                    div.className = 'flex-shrink-0 w-32 text-center cursor-pointer group';
                    div.onclick = () => performSearch(artist.artistName);
                    div.innerHTML = `
                        <img src="${artist.image || 'https://via.placeholder.com/128'}" class="w-24 h-24 rounded-full mx-auto object-cover shadow-lg group-hover:ring-2 ring-green-500 transition">
                        <p class="mt-2 text-sm font-medium truncate">${artist.artistName}</p>
                    `;
                    container.appendChild(div);
                });
            } else {
                section.classList.add('hidden');
            }
        }

        function renderFollowedAlbums() {
            // Check if container exists, if not create it
            let section = document.getElementById('followedAlbumsSection');
            if (!section) {
                const dashboard = document.getElementById('dashboard');
                section = document.createElement('div');
                section.id = 'followedAlbumsSection';
                section.className = 'w-full hidden mt-8'; // Margin top for spacing
                section.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-compact-disc text-purple-400"></i> Takip Edilen Albümler</h3>
                    <div id="followedAlbumsContainer" class="flex gap-4 overflow-x-auto pb-4 hide-scrollbar"></div>
                `;

                // Layout Requirement: Place BELOW "Takip Ettiklerim" (Following Section)
                // Existing structure: ... -> playlistsSection -> followingSection
                const followingSection = document.getElementById('followingSection');
                if (followingSection) {
                    followingSection.insertAdjacentElement('afterend', section);
                } else {
                    dashboard.appendChild(section);
                }
            }

            const container = document.getElementById('followedAlbumsContainer');
            container.innerHTML = '';

            if (albumFollows.length > 0) {
                section.classList.remove('hidden');
                albumFollows.forEach(album => {
                    const div = document.createElement('div');
                    div.className = 'flex-shrink-0 w-40 cursor-pointer group bg-[#181818] p-3 rounded-lg hover:bg-[#282828] transition';
                    div.onclick = () => openAlbumModal(album.albumId);
                    div.innerHTML = `
                        <div class="relative aspect-square mb-2 overflow-hidden rounded">
                            <img src="${album.image || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover group-hover:scale-105 transition">
                        </div>
                        <p class="font-bold truncate text-sm">${album.albumName}</p>
                        <p class="text-xs text-gray-400 truncate">${album.artistName}</p>
                    `;
                    container.appendChild(div);
                });
            } else {
                section.classList.add('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('results').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
        }

        function setSearchType(type) {
            searchType = type;
            document.getElementById('type-artist').classList.toggle('text-green-500', type === 'artist');
            document.getElementById('type-track').classList.toggle('text-green-500', type === 'track');
        }

        async function performSearch(overrideQuery) {
            const query = overrideQuery || document.getElementById('searchInput').value;
            if (!query) return;

            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('artistContent').classList.add('hidden');
            document.getElementById('trackResults').classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}/search?artist=${encodeURIComponent(query)}&type=${searchType === 'artist' ? 'simple' : 'track'}`);
                if (!res.ok) {
                    const errorText = await res.text();
                    try {
                        const errorJson = JSON.parse(errorText);
                        throw new Error(errorJson.error || `Sunucu Hatası (${res.status})`);
                    } catch (parseError) {
                        throw new Error(`Sunucu Hatası (${res.status}): ${res.statusText}`);
                    }
                }
                const data = await res.json();

                if (searchType === 'artist') {
                    if (data.error) throw new Error(data.error);
                    renderArtistPage(data);
                } else {
                    renderTrackResults(data);
                }
            } catch (e) {
                console.error(e);
                alert('Arama başarısız: ' + e.message + '\nLütfen Render panelinden API anahtarlarınızı (SPOTIFY_CLIENT_ID vs.) kontrol edin.');
                showDashboard();
            }
        }

            } else {
                likedTracks.push({ trackId: id, trackName: name, image: img, previewUrl: prev });
            }
            document.getElementById('likedCount').innerText = `${likedTracks.length} songs`;

            // Update Icons
            const heartIcons = document.querySelectorAll(`button[onclick*="${id}"] i`);
            heartIcons.forEach(icon => {
                if (!existing) {
                    icon.className = 'fa-solid fa-heart text-green-500';
                    icon.parentElement.classList.add('text-green-500');
                    icon.parentElement.parentElement.querySelector('p').classList.add('text-green-500');
                } else {
                    icon.className = 'fa-regular fa-heart';
                    icon.parentElement.classList.remove('text-green-500');
                    icon.parentElement.parentElement.querySelector('p').classList.remove('text-green-500');
                }
            });

            await fetch(`${API_URL}/like`, {
                method: 'POST', body: JSON.stringify({ trackId: id, trackName: name, image: img, previewUrl: prev }),
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
            });
        }

        async function handleAuth() {
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;
            const endpoint = document.getElementById('authTitle').innerText === 'Log In' ? '/login' : '/register';
            try {
                const r = await fetch(API_URL + endpoint, { method: 'POST', body: JSON.stringify({ username: u, password: p }), headers: { 'Content-Type': 'application/json' } });
                const d = await r.json();
                if (d.token) {
                    token = d.token; currentUser = d.username;
                    localStorage.setItem('userToken', token); localStorage.setItem('userUsername', currentUser);
                    closeAuthModal(); updateAuthUI(); fetchUserData();
                } else {
                    alert('Giriş Başarısız: ' + (d.error || 'Bilinmeyen Hata'));
                }
            } catch (e) {
                console.error(e);
                alert('Bağlantı Hatası: ' + e.message + '\nLütfen internet bağlantınızı ve sunucu durumunu kontrol edin.');

            else { btn.innerText = 'FOLLOW'; btn.className = 'border border-gray-500 hover:border-white px-6 py-2 rounded-full font-bold transition'; }

        function playTrack(id, url) {
            if (currentAudio && playingTrackId === id) {
                if (currentAudio.paused) { currentAudio.play(); updateIcons(id, true); }
                else { currentAudio.pause(); updateIcons(id, false); }
            } else {
                if (currentAudio) { currentAudio.pause(); updateIcons(playingTrackId, false); }
                currentAudio = new Audio(url); currentAudio.volume = 0.5; playingTrackId = id;
                currentAudio.play(); updateIcons(id, true);
                currentAudio.onended = () => { playingTrackId = null; updateIcons(id, false); };
            }
        }
        function updateIcons(id, playing) {
            const row = document.getElementById(`track-${id}`);
            if (row) {
                if (playing) row.classList.add('playing-row'); else row.classList.remove('playing-row');
                const i = row.querySelector('.relative i');
                if (i) i.className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'}`;
            }
        }

                        <img src="${artist.image || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover">
                        <div>
                            <div class="font-bold text-sm">${artist.artistName} <i class="fa-solid fa-heart text-green-500 ml-1 text-xs"></i></div>
                            <div class="text-xs text-gray-400">Following</div>
                        </div>
                    `;
                    list.appendChild(div);
                });
                hasResults = true;
            }

            // 2. Remote Matches (Spotify)
            try {
                // If searching for tracks, we might want to show track results here too, but for now let's stick to artists for autocomplete 
                // OR adapt based on searchType. usage: type param.
                const typeParam = searchType === 'track' ? 'track' : 'artist';
                const res = await fetch(`${API_URL}/search?artist=${encodeURIComponent(query)}&type=${typeParam}`);
                const results = await res.json();

                if (results.length > 0) {
                    if (hasResults) {
                        const header = document.createElement('div');
                        header.className = 'px-3 py-2 text-xs font-bold text-gray-400 uppercase tracking-wider bg-[#303030]';
                        header.innerText = 'Spotify Results';
                        list.appendChild(header);
                    }

                    results.forEach(item => {
                        // Skip if already shown locally (only valid for artists)
                        if (searchType === 'artist' && localMatches.some(l => l.artistId === item.id)) return;

                        const div = document.createElement('div');
                        div.className = 'autocomplete-item flex items-center gap-3 p-3 cursor-pointer text-white transition';
                        div.onclick = () => {
                            document.getElementById('searchInput').value = item.name;
                            list.classList.add('hidden');
                            performSearch(item.name);
                        };

                        // Handle display diffs for Artist vs Track
                        const img = item.image || 'https://via.placeholder.com/40';
                        const title = item.name;
                        const sub = searchType === 'artist' ? (item.genres || 'Artist') : (item.artist || 'Track');

                        div.innerHTML = `
                            <img src="${img}" class="w-10 h-10 ${searchType === 'artist' ? 'rounded-full' : 'rounded'} object-cover">
                            <div>
                                <div class="font-bold text-sm">${title}</div>
                                <div class="text-xs text-gray-400 truncate">${sub}</div>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                    hasResults = true;
                }
            } catch (e) { console.error('Autocomplete Error', e); }

            if (hasResults) list.classList.remove('hidden');
            else list.classList.add('hidden');
        }
    </script>
</body>

</html>
