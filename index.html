<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .spotify-green {
            color: #1DB954;
        }

        .bg-spotify {
            background-color: #1DB954;
        }

        .btn-spotify {
            background-color: #1DB954;
            transition: 0.3s;
        }

        .btn-spotify:hover {
            background-color: #1ed760;
        }

        /* Modal Animation */
        .modal {
            transition: opacity 0.3s ease-in-out;
        }

        .modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal.visible {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Top Bar -->
    <div class="w-full max-w-6xl flex justify-between items-center mb-10">
        <h1 class="text-3xl font-bold">Music <span class="spotify-green">Library</span></h1>
        <div id="authSection">
            <!-- Injected by JS -->
            <button onclick="openAuthModal()"
                class="bg-white text-black font-bold px-4 py-2 rounded-full hover:bg-gray-200">
                Log In
            </button>
        </div>
    </div>

    <!-- Search Section -->
    <div class="w-full max-w-xl flex gap-3 mb-12">
        <input type="text" id="searchInput" placeholder="Search for an artist..."
            class="flex-1 px-5 py-3 rounded-full bg-gray-800 border-none focus:ring-2 focus:ring-[#1DB954] text-white outline-none">
        <button onclick="searchArtist()" class="btn-spotify text-black font-bold px-6 py-3 rounded-full">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <!-- Main Content -->
    <div id="results" class="w-full max-w-6xl hidden animate-fade-in">

        <!-- Artist Header -->
        <div
            class="flex flex-col md:flex-row items-center gap-8 mb-12 bg-gradient-to-r from-gray-900 to-gray-800 p-8 rounded-2xl shadow-xl relative group">
            <img id="artistImage" src=""
                class="w-56 h-56 rounded-full object-cover shadow-2xl ring-4 ring-[#1DB954]/20">
            <div class="text-center md:text-left flex-1">
                <h2 id="artistName" class="text-5xl font-extrabold mb-4 tracking-tight"></h2>
                <div class="flex flex-wrap justify-center md:justify-start gap-3 items-center">
                    <button id="followBtn" onclick="toggleFollow()"
                        class="border border-gray-500 hover:border-white px-6 py-2 rounded-full font-bold uppercase text-xs tracking-widest transition">
                        Follow
                    </button>
                    <!-- Smart Links -->
                    <div id="smartLinks" class="flex gap-4 ml-4 text-xl text-gray-400">
                        <!-- Links injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Albums Grid -->
        <h3 class="text-2xl font-bold mb-6 flex items-center gap-2"><i class="fa-solid fa-compact-disc"></i> Discography
        </h3>
        <div id="albumsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
    </div>

    <!-- --- Modals --- -->

    <!-- Auth Modal -->
    <div id="authModal" class="modal hidden fixed inset-0 bg-black/80 flex justify-center items-center z-50">
        <div class="bg-gray-900 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-gray-800">
            <div class="flex justify-between mb-6">
                <h2 class="text-2xl font-bold" id="authTitle">Log In</h2>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-white"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="text" id="authUsername" placeholder="Username"
                class="w-full bg-gray-800 p-3 rounded mb-4 text-white focus:outline-none focus:ring-1 focus:ring-green-500">
            <input type="password" id="authPassword" placeholder="Password"
                class="w-full bg-gray-800 p-3 rounded mb-6 text-white focus:outline-none focus:ring-1 focus:ring-green-500">
            <button onclick="handleAuth()"
                class="w-full btn-spotify text-black font-bold py-3 rounded-full mb-4">Submit</button>
            <p class="text-center text-sm text-gray-400 cursor-pointer hover:underline" onclick="toggleAuthMode()"
                id="authSwitch">
                Don't have an account? Register
            </p>
        </div>
    </div>

    <!-- Album Details Modal -->
    <div id="albumModal" class="modal hidden fixed inset-0 bg-black/80 flex justify-center items-center z-50 p-4">
        <div
            class="bg-gray-900 rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col border border-gray-800 overflow-hidden">
            <!-- Header -->
            <div class="p-6 bg-gradient-to-b from-gray-800 to-gray-900 flex gap-6 items-end relative">
                <img id="modalAlbumCover" src="" class="w-32 h-32 shadow-lg rounded">
                <div class="flex-1">
                    <p class="text-sm uppercase tracking-wider text-gray-400">Album</p>
                    <h2 id="modalAlbumTitle" class="text-3xl font-bold truncate"></h2>
                    <p id="modalArtistName" class="text-gray-300"></p>
                </div>
                <button onclick="closeAlbumModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i
                        class="fa-solid fa-xmark fa-xl"></i></button>
            </div>

            <!-- Tracks List -->
            <div class="flex-1 overflow-y-auto p-2" id="tracksList">
                <!-- Tracks Injected Here -->
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const API_URL = 'http://localhost:3000/api';
        let currentUser = localStorage.getItem('userUsername');
        let token = localStorage.getItem('userToken');
        let currentArtistId = null;
        let followedArtists = [];
        let likedTracks = [];
        let isLoginMode = true;

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            if (token) fetchUserData();

            // Allow Enter key to search
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchArtist();
            });
        });

        // --- Auth Logic ---
        function updateAuthUI() {
            const section = document.getElementById('authSection');
            if (currentUser) {
                section.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="font-medium text-gray-300">Welcome, ${currentUser}</span>
                        <button onclick="logout()" class="text-white hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                `;
            } else {
                section.innerHTML = `<button onclick="openAuthModal()" class="bg-white text-black font-bold px-6 py-2 rounded-full hover:scale-105 transition">Log In</button>`;
            }
        }

        async function fetchUserData() {
            if (!token) return;
            try {
                const res = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                followedArtists = data.follows || [];
                likedTracks = data.likes || [];
                updateUIState();
            } catch (e) {
                console.error('Session expired');
                logout();
            }
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('authModal').classList.add('visible'), 10);
        }
        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('visible');
            setTimeout(() => document.getElementById('authModal').classList.add('hidden'), 300);
        }
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'Log In' : 'Register';
            document.getElementById('authSwitch').innerText = isLoginMode ? "Don't have an account? Register" : "Already have an account? Log In";
        }

        async function handleAuth() {
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;
            const endpoint = isLoginMode ? '/login' : '/register';

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (data.token) {
                    token = data.token;
                    currentUser = data.username;
                    localStorage.setItem('userToken', token);
                    localStorage.setItem('userUsername', currentUser);
                    updateAuthUI();
                    closeAuthModal();
                    fetchUserData();
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert('Auth failed');
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            followedArtists = [];
            likedTracks = [];
            localStorage.clear();
            updateAuthUI();
            updateUIState();
        }

        // --- Main App Logic ---
        async function searchArtist() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            document.getElementById('albumsGrid').innerHTML = '<div class="col-span-full text-center py-10"><i class="fa-solid fa-circle-notch fa-spin fa-2xl text-green-500"></i></div>';
            document.getElementById('results').classList.remove('hidden');

            try {
                // Fetch public search
                const res = await fetch(`${API_URL}/search?artist=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                // Update Artist Header
                currentArtistId = data.id;
                document.getElementById('artistName').innerText = data.name;
                document.getElementById('artistImage').src = data.image || 'https://via.placeholder.com/300';

                // Smart Links
                const linksHtml = `
                    <a href="https://open.spotify.com/artist/${data.id}" target="_blank" class="hover:text-green-500"><i class="fa-brands fa-spotify"></i></a>
                    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(data.name)}" target="_blank" class="hover:text-red-500"><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(data.name)}" target="_blank" class="hover:text-white"><i class="fa-brands fa-wikipedia-w"></i></a>
                `;
                document.getElementById('smartLinks').innerHTML = linksHtml;

                // Render Albums
                const grid = document.getElementById('albumsGrid');
                grid.innerHTML = '';
                if (data.albums.length === 0) grid.innerHTML = '<p class="text-gray-500">No albums found.</p>';

                data.albums.forEach(album => {
                    const el = document.createElement('div');
                    el.className = 'bg-[#181818] p-4 rounded-lg hover:bg-[#282828] transition duration-300 cursor-pointer group';
                    el.onclick = () => openAlbumModal(album.id);
                    el.innerHTML = `
                        <div class="relative mb-4">
                            <img src="${album.image || 'https://via.placeholder.com/200'}" class="w-full aspect-square object-cover rounded-md shadow-lg group-hover:shadow-xl">
                            <button class="absolute bottom-2 right-2 bg-green-500 rounded-full p-3 shadow-lg opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition duration-300 text-black">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                        <h4 class="font-bold text-white truncate">${album.name}</h4>
                        <p class="text-gray-400 text-sm mt-1">${album.year}</p>
                    `;
                    grid.appendChild(el);
                });

                updateUIState();
            } catch (e) {
                console.error(e);
                document.getElementById('albumsGrid').innerHTML = `<p class="col-span-full text-center text-red-500">${e.message}</p>`;
            }
        }

        async function openAlbumModal(albumId) {
            const modal = document.getElementById('albumModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('visible'), 10);

            const list = document.getElementById('tracksList');
            list.innerHTML = '<div class="flex justify-center p-10"><i class="fa-solid fa-circle-notch fa-spin fa-xl"></i></div>';

            try {
                const res = await fetch(`${API_URL}/album/${albumId}`);
                const data = await res.json();

                document.getElementById('modalAlbumCover').src = data.image || 'https://via.placeholder.com/150';
                document.getElementById('modalAlbumTitle').innerText = data.name;
                document.getElementById('modalArtistName').innerText = data.artist;

                list.innerHTML = '';
                data.tracks.forEach((track, i) => {
                    const isLiked = likedTracks.includes(track.id);
                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-4 p-3 hover:bg-white/10 rounded group';
                    row.innerHTML = `
                        <span class="text-gray-400 w-6 text-center">${i + 1}</span>
                        <div class="flex-1">
                            <p class="text-white font-medium ${isLiked ? 'text-green-500' : ''}">${track.name}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <button onclick="toggleLike('${track.id}', '${track.name.replace(/'/g, "\\'")}')" class="${isLiked ? 'text-green-500' : 'text-gray-400 hover:text-white'}">
                                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                            </button>
                            <span class="text-gray-400 text-sm">${fmtTime(track.duration_ms)}</span>
                        </div>
                    `;
                    list.appendChild(row);
                });

            } catch (e) {
                list.innerHTML = '<p class="text-red-500 text-center">Failed to load tracks</p>';
            }
        }

        function closeAlbumModal() {
            document.getElementById('albumModal').classList.remove('visible');
            setTimeout(() => document.getElementById('albumModal').classList.add('hidden'), 300);
        }

        // --- Interaction Logic ---
        async function toggleFollow() {
            if (!token) return openAuthModal();
            const btn = document.getElementById('followBtn');
            const artistName = document.getElementById('artistName').innerText;

            // Optimistic update
            const isFollowing = followedArtists.includes(currentArtistId);
            if (isFollowing) {
                followedArtists = followedArtists.filter(id => id !== currentArtistId);
            } else {
                followedArtists.push(currentArtistId);
            }
            updateButtonState(btn, !isFollowing);

            try {
                await fetch(`${API_URL}/follow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ artistId: currentArtistId, artistName })
                });
            } catch (e) {
                console.error('Follow failed');
                // Revert if failed (omitted for brevity)
            }
        }

        async function toggleLike(trackId, trackName) {
            if (!token) return openAuthModal();

            // Optimistic Update
            if (likedTracks.includes(trackId)) {
                likedTracks = likedTracks.filter(id => id !== trackId);
            } else {
                likedTracks.push(trackId);
            }
            // Re-render tracks list (simpler than finding specific element row)
            // Ideally we'd update specific DOM element but this is fast enough
            const openAlbumId = document.querySelector('#albumModal.visible') ? true : false;
            // Only re-open/render if modal is open, technically we just updated state variable
            // Real-time update:
            const heartIcons = document.querySelectorAll(`button[onclick*="${trackId}"] i`);
            heartIcons.forEach(icon => {
                if (likedTracks.includes(trackId)) {
                    icon.classList.remove('fa-regular');
                    icon.classList.add('fa-solid', 'text-green-500');
                    icon.parentElement.classList.add('text-green-500');
                } else {
                    icon.classList.add('fa-regular');
                    icon.classList.remove('fa-solid', 'text-green-500');
                    icon.parentElement.classList.remove('text-green-500');
                }
            });

            try {
                await fetch(`${API_URL}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ trackId, trackName })
                });
            } catch (e) { console.error('Like failed'); }
        }

        function updateUIState() {
            // Update Follow Button
            if (currentArtistId) {
                const isFollowed = followedArtists.includes(currentArtistId);
                const btn = document.getElementById('followBtn');
                updateButtonState(btn, isFollowed);
            }
        }

        function updateButtonState(btn, isFollowed) {
            if (isFollowed) {
                btn.innerText = 'Following';
                btn.className = 'bg-green-500 text-black border-none px-6 py-2 rounded-full font-bold uppercase text-xs tracking-widest transition hover:scale-105';
            } else {
                btn.innerText = 'Follow';
                btn.className = 'border border-gray-500 hover:border-white px-6 py-2 rounded-full font-bold uppercase text-xs tracking-widest transition text-white';
            }
        }

        function fmtTime(ms) {
            const min = Math.floor(ms / 60000);
            const sec = ((ms % 60000) / 1000).toFixed(0);
            return min + ":" + (sec < 10 ? '0' : '') + sec;
        }

    </script>
</body>

</html>
